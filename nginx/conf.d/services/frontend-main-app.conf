# Catch-all: route everything not matched by a more specific location to the
# Next.js main app. New frontend apps get their own services/*.conf file with
# a specific prefix (e.g. /landing/) and will take precedence over this block.

location / {
    proxy_pass http://frontend-main-app;
    include /etc/nginx/conf.d/proxy_params.conf;

    # Next.js uses WebSockets for HMR in dev; harmless in prod.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
}
