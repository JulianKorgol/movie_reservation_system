# Run as a non-privileged user
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Security: Information Exposure ---
    server_tokens off;

    # --- Optimization ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --- Rate Limiting Logic (The "Geo" Strategy) ---
    # Defines who gets rate-limited and who doesn't
    geo $limit_user {
        default        1;  # External users (limited)
        127.0.0.1      0;  # Localhost (unlimited)
        172.16.0.0/12  0;  # Docker internal (unlimited)
        192.168.1.0/24 0;  # Internal LAN (unlimited)
        10.0.0.0/8     0;  # Private Cloud (unlimited)
    }

    map $limit_user $limit_key {
        0 "";
        1 $binary_remote_addr;
    }

    # 10 requests per second per IP for the public
    limit_req_zone $limit_key zone=microservice_iam_limit:10m rate=10r/s;

    # --- Logging (Production JSON Format) ---
    # Easier for ELK/Datadog/CloudWatch to parse
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # --- Include Modular Configs ---
    include /etc/nginx/conf.d/*.conf;
}
