# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — PRODUCTION BASELINE
#
# Env files to create (copy the matching .example and fill in secrets):
#   envs/.env.nginx               ← envs/.env.nginx.example
#   envs/.env.microservice-iam    ← envs/.env.microservice-iam.example
#   envs/.env.postgres-iam        ← envs/.env.postgres-iam.example
#   envs/.env.frontend-main-app   ← envs/.env.frontend-main-app.example
#
# Security model
#   • backend-net is internal: true — no outbound internet from containers
#   • Only nginx has a published port (80)
#   • Every container: cap_drop ALL, no-new-privileges, user 1001:1001
#   • App containers: read_only filesystem + tmpfs for writable scratch space
#   • Postgres: cap_add only [SETUID, SETGID, DAC_READ_SEARCH]
#   • Secrets only via env_file — never inline in environment: blocks
# ─────────────────────────────────────────────────────────────────────────────

name: cinema-reservation

# ── Reusable security fragments ───────────────────────────────────────────────

# Applied to EVERY container
x-security-defaults: &security-defaults
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "1001:1001"

# Applied to app containers (not databases)
x-app-hardening: &app-hardening
  <<: *security-defaults
  read_only: true
  tmpfs:
    - /tmp:size=64m,uid=1001,gid=1001,noexec,nosuid

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  NGINX — sole public entry point                                        │
  # └─────────────────────────────────────────────────────────────────────────┘
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    # NET_BIND_SERVICE lets UID 1001 bind port 80 without running as root
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    read_only: true
    tmpfs:
      # /var/cache/nginx — proxy temp files and buffers
      - /var/cache/nginx:size=64m,uid=1001,gid=1001,noexec,nosuid
      # /var/run — nginx.pid
      - /var/run:size=8m,uid=1001,gid=1001,noexec,nosuid
      - /tmp:size=32m,uid=1001,gid=1001,noexec,nosuid
    ports:
      - "80:80"         # THE ONLY published port in the entire stack
    networks:
      - backend-net
    env_file:
      # Create from: envs/.env.nginx.example
      - ./envs/.env.nginx
    depends_on:
      microservice_iam:
        condition: service_healthy
      frontend-main-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      # nc (busybox) checks TCP — succeeds if nginx is accepting connections
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  AUTH SERVICE (Django IAM)                                              │
  # └─────────────────────────────────────────────────────────────────────────┘
  microservice_iam:
    build:
      context: ./backend/microservice_iam
      dockerfile: Dockerfile
      target: production
    <<: *app-hardening
    networks:
      - backend-net
    ports: []
    env_file:
      # Create from: envs/.env.microservice-iam.example
      - ./envs/.env.microservice-iam
    depends_on:
      postgres-iam:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      # curl is installed in the Dockerfile — any HTTP response = healthy
      test: ["CMD-SHELL", "curl -so/dev/null -w '%{http_code}' http://127.0.0.1:8000/ | grep -qE '^[2-5]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  FRONTEND — Next.js main app                                            │
  # └─────────────────────────────────────────────────────────────────────────┘
  frontend-main-app:
    build:
      context: ./frontend/frontend_main_app
      dockerfile: Dockerfile
      target: production
    <<: *app-hardening
    networks:
      - backend-net
    ports: []
    env_file:
      # Create from: envs/.env.frontend-main-app.example
      - ./envs/.env.frontend-main-app
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
    restart: unless-stopped
    healthcheck:
      # curl is installed in the Dockerfile
      test: ["CMD-SHELL", "curl -so/dev/null -w '%{http_code}' http://127.0.0.1:3000/ | grep -qE '^[2-5]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  POSTGRES — IAM service database (not shared with any other service)    │
  # └─────────────────────────────────────────────────────────────────────────┘
  postgres-iam:
    image: postgres:18-alpine
    # Postgres drops privileges internally; it needs SETUID/SETGID to do so.
    # CHOWN is required so the official entrypoint can fix ownership on a new
    # data volume before initialization; DAC_READ_SEARCH is retained for file access.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-net
    ports: []
    env_file:
      # Create from: envs/.env.postgres-iam.example
      - ./envs/.env.postgres-iam
    volumes:
      - postgres-iam-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend-net:
    driver: bridge
    # internal: true means containers cannot make outbound internet calls.
    # All external traffic must enter through nginx on port 80.
    internal: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-iam-data:
